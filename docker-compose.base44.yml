services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: haoken
      POSTGRES_PASSWORD: haoken
      POSTGRES_DB: haoken
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haoken -d haoken"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: haoken
      PGPASSWORD: haoken
      PGDATABASE: haoken
    volumes:
      - ./scripts/migrate.sql:/migrate.sql
    command: psql -f /migrate.sql
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    working_dir: /app
    command: sh -c "npm install && npx next dev -H 0.0.0.0 -p 3000"
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - WATCHPACK_POLLING=true
      - DATABASE_URL=postgresql://haoken:haoken@db:5432/haoken
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  pgdata:
